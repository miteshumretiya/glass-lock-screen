name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/release.jks.enc \
              -out "$RUNNER_TEMP/release.jks" -pass env:SIGNING_PASSWORD
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEY_ALIAS=glasslock"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_PASSWORD secret not set; signing with a throwaway debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Share the build log if it failed
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/log"
          cd "$RUNNER_TEMP/log"
          grep -nE "^e: |error:|FAILURE|What went wrong|Could not|> Task .*FAILED|Exception" "$RUNNER_TEMP/build.log" | head -300 > errors.txt || true
          tail -400 "$RUNNER_TEMP/build.log" > tail.txt || true
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add errors.txt tail.txt
          git commit -q -m "Build ${{ github.run_number }} failed"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:build-log

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "GlassLock-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GlassLock-1.0.${{ github.run_number }}
          path: GlassLock-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "GlassLock-1.0.${{ github.run_number }}.apk" \
            --title "Glass Lock 1.0.${{ github.run_number }}" \
            --notes "Install the APK on your Pixel. See the README for setup steps." \
            --latest

      - name: Put the APK on the apk branch
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp GlassLock-*.apk "$RUNNER_TEMP/apk/GlassLock-latest.apk"
          cd "$RUNNER_TEMP/apk"
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add GlassLock-latest.apk
          git commit -q -m "APK from build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GlassLock-1.0.${{ github.run_number }}
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/smoke-test.sh

      - name: Publish test results
        if: always()
        run: |
          mkdir -p test-results
          cp -r test-results "$RUNNER_TEMP/results"
          cd "$RUNNER_TEMP/results"
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Smoke test results for build ${{ github.run_number }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:test-results
